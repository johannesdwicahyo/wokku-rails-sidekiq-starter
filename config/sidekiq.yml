# Sidekiq runtime config. Tuned conservatively for a bundled container
# where Rails + Sidekiq share the same memory cap (~512 MB on Small,
# ~2 GB on Medium). Bump concurrency to 10 on Medium+ if your jobs
# are I/O-bound rather than memory-bound.
:concurrency: 5
:queues:
  - [critical, 2]
  - [default, 1]
  - [low, 1]
:timeout: 25
